[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stampgen"
version = "2.0.0"
description = "名字印章批量生成工具：定宽自适应 + 可换字体 + 可调字重"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fonttools>=4.40",
]

[project.optional-dependencies]
gui = ["tkinterdnd2>=0.3"]
dev = ["pytest>=7.4", "pyinstaller>=6.0", "pillow>=10.0"]

[project.scripts]
stampgen = "stampgen.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stampgen = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q -p no:cacheprovider"
